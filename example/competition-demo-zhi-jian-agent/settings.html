<!doctype html>
<html lang="zh-CN" data-theme="auto" data-visual-theme="systems">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课程设置 · 智鉴 Agent</title>
  <meta name="description" content="统一管理当前课程的 AI 模型连接。">
  <link rel="stylesheet" href="./assets/style.css">
  <link rel="stylesheet" href="./assets/demo.css">
</head>
<body class="settings-page" data-course-key="competition-demo-zhi-jian-agent">
  <a class="skip-link" href="#main-content">跳到正文</a>
  <button class="nav-toggle" type="button" aria-controls="course-sidebar" aria-expanded="false">课程导航</button>
  <div class="page-shell">
    <aside id="course-sidebar" class="sidebar" aria-label="课程导航">
      <nav class="course-settings-nav" aria-label="课程设置"><a href="./settings.html" aria-current="page">课程设置</a></nav>
      <div class="brand-block"><span class="eyebrow">智鉴 Agent</span><a class="course-title" href="./index.html">智能体开发与安全实战</a></div>
      <nav class="sidebar-section" aria-label="当前页面导航"><h2>设置目录</h2><ol class="toc-list" data-toc><li><a href="#ai-model">AI 模型连接</a></li></ol></nav>
      <nav class="sidebar-section" aria-label="学习入口"><h2>继续学习</h2><ol class="course-list"><li><a href="./index.html">课程首页</a></li><li><a href="./index.html" data-settings-return>返回学习页面</a></li></ol></nav>
    </aside>
    <main id="main-content" class="content">
      <header class="lesson-hero"><div><span class="eyebrow">Course Settings</span><h1>课程设置</h1><p class="lead">连接一个模型，在每一课随时提问。连接全课程共用，对话按课独立保存。</p></div></header>
      <section id="ai-model" class="content-section tutor-panel" data-tutor-settings-page>
        <h2>AI 模型连接</h2>
        <p class="resource-access" data-settings-current></p>
        <form class="tutor-config" autocomplete="off">
          <div class="tutor-config-grid">
            <label>服务类型<select name="kind"><option value="openai-compatible">OpenAI-compatible</option><option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option><option value="ollama">Ollama</option><option value="custom">自定义</option></select></label>
            <label class="settings-key-row">API Key<span class="secret-field"><input name="api_key" type="password" maxlength="512" autocomplete="new-password" spellcheck="false" placeholder="输入密钥，本机模型可留空"><button type="button" class="secret-toggle" data-key-toggle aria-label="显示 API Key" aria-pressed="false" title="显示 API Key"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
            <div class="settings-model-row"><label>模型<select name="model" required><option value="">请先获取模型</option><option value="__manual__">手动填写模型 ID…</option></select></label><div class="tutor-actions"><button type="button" data-settings-models>获取模型</button></div></div>
            <label class="settings-key-row" data-model-manual hidden>模型 ID<input name="model_manual" maxlength="120" placeholder="服务提供的完整模型 ID" disabled></label>
          </div>
          <details class="settings-advanced">
            <summary>高级设置 · 地址、输出预算与思考模式</summary>
            <div class="tutor-config-grid">
              <label>提供商名称<input name="provider" maxlength="80" required></label>
              <label>连接模式<select name="mode"><option value="cloud">云端 HTTPS</option><option value="local">本机服务</option></select></label>
              <label class="settings-key-row">API 基础地址<input name="base_url" type="url" maxlength="300" placeholder="https://模型服务域名/v1" required></label>
              <label>输出 token 上限<input name="max_tokens" type="number" min="128" max="16384" value="4096" required></label>
              <label>DeepSeek 思考模式<select name="thinking"><option value="disabled">关闭 · 普通答疑</option><option value="enabled">开启 · 深入推理</option></select></label>
            </div>
            <p class="resource-access" data-settings-protocol></p>
          </details>
          <div class="tutor-actions"><button type="submit">保存并启用</button><button type="button" data-settings-test>测试连接</button><button type="button" data-settings-forget>断开连接</button></div>
          <p class="tutor-status" role="status" aria-live="polite">正在连接课程服务…</p>
          <p class="settings-help">密钥只保留在当前服务会话中，重启后重新输入。测试连接会发送一个简短请求。</p>
        </form>
        <p><a href="./index.html" data-settings-return>返回学习页面 →</a></p>
      </section>
    </main>
  </div>
  <script src="./assets/course.js"></script>
  <script src="./assets/tutor-settings.js"></script>
</body>
</html>
