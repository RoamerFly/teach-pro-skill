<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#334e68" stroke-width="1.5"/></marker></defs>
  <rect width="1200" height="440" fill="white"/>
  <g font-family="Microsoft YaHei, sans-serif" fill="#111827" text-anchor="middle">
    <rect x="20" y="65" width="310" height="195" rx="10" fill="#eef4fa" stroke="#91a4b8" stroke-width="2"/>
    <text x="175" y="108" font-size="25" font-weight="700">课程生成 AI 与 Teach Pro</text>
    <text x="175" y="149" font-size="21">评估基础  处理疑难</text><text x="175" y="184" font-size="21">依据证据选择一节课</text><text x="175" y="219" font-size="21">更新画像与学习路线</text>
    <rect x="450" y="65" width="330" height="195" rx="10" fill="#eef4fa" stroke="#91a4b8" stroke-width="2"/>
