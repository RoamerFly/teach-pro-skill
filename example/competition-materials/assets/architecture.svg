    <rect x="905" y="65" width="275" height="195" rx="10" fill="#eef4fa" stroke="#91a4b8" stroke-width="2"/>
    <text x="1042" y="108" font-size="25" font-weight="700">学员</text><text x="1042" y="149" font-size="21">阅读与练习</text><text x="1042" y="184" font-size="21">提交解释与疑难</text><text x="1042" y="219" font-size="21">请求继续学习</text>
    <path d="M330 124 H450" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><text x="390" y="109" font-size="18">交付课程</text>
    <path d="M450 208 H330" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><text x="390" y="246" font-size="17">续课时读文件</text>
    <path d="M780 124 H905" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><text x="842" y="109" font-size="18">打开页面</text>
    <path d="M905 208 H780" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/><text x="842" y="246" font-size="18">保存作答</text>
    <rect x="450" y="333" width="330" height="85" rx="10" fill="#f5f7fa" stroke="#91a4b8" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="615" y="368" font-size="23" font-weight="700">可选课内 Tutor</text><text x="615" y="398" font-size="19">配置模型后  按本课上下文答疑</text>
    <path d="M615 260 V333" stroke="#334e68" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="815" y="301" font-size="18">确认后发送课文与问题</text>
    <text x="221" y="361" font-size="19">课程生成由 Agent 环境驱动</text><text x="221" y="394" font-size="19">课程设置仅管理可选答疑连接</text>
