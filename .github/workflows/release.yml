name: Release Skill

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable version tag, for example v1.2.0'
        required: true
        default: 'v1.2.0'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check runtime, examples and release packaging
        run: python -X utf8 -B -m unittest discover -s tests -p "test_*.py"
      - name: Check streaming response regressions
        run: python -X utf8 -B teach-pro/scripts/test_response_limits.py

  build:
    name: Build verified Skill packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build normal and competition Skill packages
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == v* ]]; then
            python -X utf8 -B scripts/build_release.py dist --tag "$RELEASE_TAG"
          else
            python -X utf8 -B scripts/build_release.py dist
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish stable GitHub Release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          NOTES="docs/releases/${VERSION}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --title "学途智伴 ${VERSION}" --notes-file "$NOTES" --latest
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "学途智伴 ${VERSION}" --notes-file "$NOTES" --latest
          fi
